[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cafe-impute"
version = "0.1.0"
description = "CAFE: Causal Adaptive Factor Estimation -- zero-config, CPU-first, point-in-time imputation with uncertainty, factors, anomalies and forecasts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Derek Snow" }]
keywords = ["imputation", "time-series", "panel-data", "causal", "factor-model", "missing-data"]
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
polars = ["polars>=0.20"]
viz = ["matplotlib>=3.5"]
all = ["pandas>=1.3", "polars>=0.20", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/sovai-research/cafe"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cafe*"]
