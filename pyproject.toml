[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cafe-impute"
version = "0.1.0"
description = "CAFE: Causal Adaptive Factor Estimation -- zero-config, CPU-first, point-in-time imputation with uncertainty, factors, anomalies and forecasts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Derek Snow", email = "d.snow@sov.ai" }]
keywords = ["imputation", "time-series", "panel-data", "causal", "factor-model", "missing-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.21"]   # numpy-only core — nothing else required to impute

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
polars = ["polars>=0.20"]
viz = ["matplotlib>=3.5"]
all = ["pandas>=1.3", "polars>=0.20", "matplotlib>=3.5"]
# Head-to-head causal horse race only (NOT needed to use CAFE). Installs the deep
# baselines via PyPOTS + the online Gaussian copula. Keep these OUT of the core so the
# library stays numpy-only. BayOTIDE has no PyPI release -- git-clone it separately.
# Recommended in an isolated venv: python -m venv .venv-bench && .venv-bench/bin/pip install -e ".[bench]"
bench = ["pypots>=1.4", "torch>=2.2", "gcimpute>=0.0.4", "matplotlib>=3.5"]
dev = [
    "pandas>=1.3",
    "polars>=0.20",
    "pytest>=7.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/sovai-research/cafe"
Repository = "https://github.com/sovai-research/cafe"
Issues = "https://github.com/sovai-research/cafe/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cafe*"]

[tool.setuptools.package-data]
cafe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
markers = [
    "benchmark: runs the full synthetic benchmark suite (slow-ish; ~2-3s)",
    "slow: deselect with '-m \"not slow\"'",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["bench", "paper", "notebooks"]

[tool.ruff.lint]
# Bias toward real-bug detection (F, B) and import hygiene (I); the numeric core
# is written in a deliberately dense style, so the cosmetic pycodestyle rules that
# fight it are disabled rather than mass-rewriting working hot-path code.
select = ["F", "I", "B"]
ignore = [
    "B023",  # closures over loop vars are all called immediately here (false positive)
]

[tool.ruff.lint.per-file-ignores]
# tests/gen_baseline set sys.path before importing the package + harness on purpose
"src/tests/*" = ["E402"]
