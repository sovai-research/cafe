name: Publish to PyPI

# Releases are cut by pushing a version tag, e.g.:
#   1. bump `version` in pyproject.toml  (e.g. 0.1.1)
#   2. git commit -am "Release 0.1.1" && git push
#   3. git tag v0.1.1 && git push origin v0.1.1
# This workflow then tests, verifies the tag matches the package version,
# builds the sdist+wheel, and uploads to PyPI.
#
# Auth uses the PYPI_API_TOKEN repo secret. To upgrade to PyPI Trusted
# Publishing (no stored secret): configure a pending publisher on PyPI for
# this repo + workflow, add `permissions: id-token: write` to the publish
# job, and drop the `password:` line below.

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (with dev deps)
        run: pip install -e ".[dev]"
      - name: Run fast test suite
        run: pytest -q -m "not slow and not benchmark"

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Check distributions
        run: |
          pip install twine
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
